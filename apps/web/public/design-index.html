<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recap — AI meeting notetaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb;
    --panel:#ffffff;
    --ink:#12141c;
    --ink-2:#1c1f2b;
    --border:#e6e8f0;
    --muted:#6b7086;
    --accent:#5b4bff;
    --accent-dim:#eeecff;
    --accent-2:#ff5c7c;
    --good:#1fbf83;
    --good-dim:#e3f9ef;
    --gold:#ffb648;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{ font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); overflow:hidden; }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

  .app{ display:grid; grid-template-columns:280px 1fr; height:100vh; }

  /* ---- Sidebar ---- */
  .sidebar{ background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
  .brand{ display:flex; align-items:center; gap:10px; padding:20px 20px 16px 20px; }
  .brand-mark{ width:30px;height:30px;border-radius:9px; background:var(--accent); display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .brand-mark svg{ width:16px; height:16px; }
  .brand-name{ font-size:16.5px; font-weight:800; letter-spacing:-0.02em; }

  .ask-box{
    margin:0 16px 14px 16px; display:flex; align-items:center; gap:8px;
    background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:9px 12px;
  }
  .ask-box input{ border:none; background:none; outline:none; font-size:13px; width:100%; font-family:'Inter',sans-serif; color:var(--ink); }
  .ask-box svg{ opacity:.5; flex-shrink:0; }
  .ask-hint{ font-size:11px; color:var(--muted); margin:-8px 16px 14px 16px; min-height:14px; }

  .new-btn{
    margin:0 16px 18px 16px; background:var(--ink); color:#fff; border:none; border-radius:10px;
    padding:10px; font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
    transition:background .12s ease;
  }
  .new-btn:hover{ background:var(--ink-2); }

  .section-label{ font-size:10.5px; font-weight:700; letter-spacing:.04em; color:var(--muted); margin:2px 20px 8px 20px; }
  .meeting-list{ flex:1; overflow-y:auto; padding:0 10px 16px 10px; }

  .m-card{ display:flex; gap:10px; padding:10px; border-radius:10px; cursor:pointer; margin-bottom:2px; }
  .m-card:hover{ background:var(--bg); }
  .m-card.active{ background:var(--accent-dim); }
  .m-thumb{
    width:52px; height:38px; border-radius:8px; flex-shrink:0; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#2b2f45,#171925); display:flex; align-items:center; justify-content:center;
  }
  .m-thumb .play{ width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent #fff; opacity:.85; }
  .m-thumb .live{ position:absolute; top:3px; left:4px; width:6px;height:6px;border-radius:50%; background:var(--accent-2); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(255,92,124,.6);} 70%{box-shadow:0 0 0 5px rgba(255,92,124,0);} 100%{box-shadow:0 0 0 0 rgba(255,92,124,0);} }
  .m-info{ min-width:0; flex:1; }
  .m-title{ font-size:12.5px; font-weight:700; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .m-sub{ font-size:11px; color:var(--muted); margin-top:2px; display:flex; gap:5px; align-items:center; }

  /* ---- Main ---- */
  .main{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .topbar{ padding:20px 28px 14px 28px; border-bottom:1px solid var(--border); background:var(--panel); display:flex; justify-content:space-between; align-items:flex-start; }
  .tb-title{ font-size:19px; font-weight:800; letter-spacing:-0.01em; margin:0 0 5px 0; }
  .tb-meta{ font-size:12.5px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }
  .tb-actions{ display:flex; gap:8px; }
  .btn{ font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:9px; border:1px solid var(--border); background:var(--panel); cursor:pointer; display:flex; align-items:center; gap:6px; transition:all .12s ease; }
  .btn:hover{ background:var(--bg); }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.primary:hover{ background:#4c3ef0; }

  /* split workspace */
  .workspace{ flex:1; display:grid; grid-template-columns:1fr 380px; overflow:hidden; }
  .left-pane{ overflow-y:auto; padding:20px 28px 60px 28px; }
  .right-pane{ border-left:1px solid var(--border); background:var(--panel); overflow-y:auto; padding:0; display:flex; flex-direction:column; }

  /* video player */
  .player{
    background:linear-gradient(135deg,#1c1f30,#0f111a); border-radius:16px; aspect-ratio:16/9; position:relative;
    display:flex; align-items:center; justify-content:center; overflow:hidden; margin-bottom:6px;
  }
  .player .center-play{
    width:56px;height:56px;border-radius:50%; background:rgba(255,255,255,.14); backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center; cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .player .center-play:hover{ background:rgba(255,255,255,.22); transform:scale(1.06); }
  .player .center-play .tri{ width:0;height:0;border-style:solid;border-width:10px 0 10px 16px;border-color:transparent transparent transparent #fff; margin-left:4px; }
  .player .caption{ position:absolute; bottom:14px; left:16px; right:16px; color:#e9e9f5; font-size:13px; background:rgba(0,0,0,.35); padding:6px 10px; border-radius:8px; backdrop-filter:blur(3px); }
  .scrub{ height:4px; background:var(--border); border-radius:4px; margin:10px 0 18px 0; position:relative; cursor:pointer; }
  .scrub-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--accent); border-radius:4px; transition:width .3s linear; }
  .scrub-dot{ position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:var(--accent); transform:translate(-50%,-50%); box-shadow:0 0 0 3px #fff; }

  .transcript-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .t-search{ flex:1; display:flex; align-items:center; gap:7px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:7px 12px; max-width:280px; }
  .t-search input{ border:none; background:none; outline:none; font-size:12.5px; width:100%; font-family:'Inter',sans-serif; }
  .match-count{ font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .autoscroll-toggle{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
  .autoscroll-toggle .dot{ width:8px;height:8px;border-radius:50%; background:var(--border); }
  .autoscroll-toggle.on .dot{ background:var(--good); }

  .t-line{ display:flex; gap:12px; padding:9px 8px; border-radius:9px; align-items:flex-start; cursor:pointer; }
  .t-line:hover{ background:var(--bg); }
  .t-line.current{ background:var(--accent-dim); }
  .t-time{ font-size:11px; color:var(--muted); width:38px; flex-shrink:0; padding-top:3px; font-variant-numeric:tabular-nums; }
  .t-avatar{ width:26px;height:26px;border-radius:50%; flex-shrink:0; font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; color:#fff; margin-top:1px; }
  .t-body{ flex:1; min-width:0; }
  .t-speaker{ font-size:12px; font-weight:700; margin-bottom:2px; }
  .t-text{ font-size:13.5px; line-height:1.5; color:var(--ink-2); }
  .t-text mark{ background:var(--gold); border-radius:3px; padding:0 2px; }
  .t-star{ flex-shrink:0; cursor:pointer; opacity:.3; padding:4px; transition:all .12s ease; margin-top:1px; font-size:14px; }
  .t-star:hover{ opacity:.75; transform:scale(1.15); }
  .t-star.on{ opacity:1; }

  /* right pane tabs */
  .r-tabs{ display:flex; border-bottom:1px solid var(--border); }
  .r-tab{ flex:1; text-align:center; padding:13px 0; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; position:relative; }
  .r-tab.active{ color:var(--ink); }
  .r-tab.active::after{ content:''; position:absolute; left:14px; right:14px; bottom:-1px; height:2px; background:var(--accent); border-radius:2px; }
  .r-content{ flex:1; overflow-y:auto; padding:18px 18px 40px 18px; }

  .template-row{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .chip{ font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:999px; border:1px solid var(--border); background:var(--bg); cursor:pointer; color:var(--muted); }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .sec-title{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin:18px 0 8px 0; }
  .sec-title:first-child{ margin-top:0; }
  .summary-list{ margin:0; padding:0; list-style:none; }
  .summary-list li{ font-size:13px; line-height:1.55; padding:7px 0; border-bottom:1px solid #f1f2f7; display:flex; gap:8px; }
  .summary-list li:last-child{ border-bottom:none; }
  .summary-list li::before{ content:''; width:5px;height:5px;border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:7px; }

  .hl-row{ display:flex; gap:10px; padding:8px 0; border-bottom:1px solid #f1f2f7; cursor:pointer; align-items:flex-start; }
  .hl-row:last-child{ border-bottom:none; }
  .hl-time{ font-size:11px; font-weight:800; background:var(--gold); color:#3a2a00; border-radius:6px; padding:2px 6px; flex-shrink:0; margin-top:1px; }
  .hl-text{ font-size:12.5px; line-height:1.5; }
  .empty-note{ font-size:12.5px; color:var(--muted); font-style:italic; }

  .action-item{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid #f1f2f7; }
  .action-item:last-child{ border-bottom:none; }
  .check{ width:18px; height:18px; border-radius:6px; border:2px solid #d7d9e6; flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .check.done{ background:var(--good); border-color:var(--good); }
  .check.done::after{ content:'✓'; color:#fff; font-size:11px; font-weight:800; }
  .ai-text{ font-size:13px; line-height:1.5; }
  .ai-text.done{ text-decoration:line-through; color:var(--muted); }
  .ai-owner{ font-size:11px; color:var(--muted); margin-top:2px; }
  .progress-track{ height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:14px; }
  .progress-fill{ height:100%; background:var(--good); transition:width .3s ease; }
  .celebrate{ text-align:center; padding:14px; font-size:12.5px; color:var(--good); font-weight:700; display:none; }

  /* share modal + toast */
  .overlay{ position:fixed; inset:0; background:rgba(10,10,20,.5); display:none; align-items:center; justify-content:center; z-index:50; }
  .overlay.show{ display:flex; }
  .modal{ background:var(--panel); border-radius:16px; padding:24px; width:400px; max-width:90vw; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal h3{ font-size:16px; font-weight:800; margin:0 0 6px 0; }
  .modal p{ font-size:12.5px; color:var(--muted); margin:0 0 16px 0; line-height:1.5; }
  .link-row{ display:flex; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:9px 11px; margin-bottom:14px; }
  .link-row input{ border:none; background:none; outline:none; flex:1; font-size:12.5px; color:var(--muted); font-family:'Inter',sans-serif; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:12.5px; font-weight:700; opacity:0; transition:all .25s ease; z-index:60; pointer-events:none; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ width:7px; }
  ::-webkit-scrollbar-thumb{ background:#d8dae6; border-radius:8px; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/><path d="M12 7v5l3 3" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="brand-name">Recap</div>
    </div>
    <div class="ask-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="globalSearch" placeholder="Ask Recap anything…" oninput="handleGlobalSearch(this.value)">
    </div>
    <div class="ask-hint" id="searchHint"></div>
    <button class="new-btn" onclick="showToast('Recording capture is stubbed in this demo build 👋')">＋ Record a meeting</button>
    <div class="section-label">MEETINGS</div>
    <div class="meeting-list" id="meetingList"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <h1 class="tb-title" id="mTitle"></h1>
        <div class="tb-meta" id="mMeta"></div>
      </div>
      <div class="tb-actions">
        <button class="btn" onclick="openShare()">↗ Share</button>
        <button class="btn primary" onclick="togglePlay()">▶ Play</button>
      </div>
    </div>

    <div class="workspace">
      <div class="left-pane">
        <div class="player" id="player">
          <div class="center-play" onclick="togglePlay()"><div class="tri" id="playIcon"></div></div>
          <div class="caption" id="caption"></div>
        </div>
        <div class="scrub" id="scrub" onclick="scrubTo(event)">
          <div class="scrub-fill" id="scrubFill"></div>
          <div class="scrub-dot" id="scrubDot" style="left:0%"></div>
        </div>

        <div class="transcript-toolbar">
          <div class="t-search">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="tSearch" placeholder="Search this transcript…" oninput="renderTranscript(this.value)">
          </div>
          <span class="match-count" id="matchCount"></span>
          <div style="flex:1"></div>
          <div class="autoscroll-toggle on" id="autoscrollToggle" onclick="toggleAutoscroll()"><div class="dot"></div>Auto-scroll</div>
        </div>
        <div id="transcriptBody"></div>
      </div>

      <div class="right-pane">
        <div class="r-tabs">
          <div class="r-tab active" data-tab="summary" onclick="switchTab('summary')">Summary</div>
          <div class="r-tab" data-tab="actions" onclick="switchTab('actions')">Action items</div>
        </div>
        <div class="r-content" id="rightContent"></div>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="shareOverlay">
  <div class="modal">
    <h3>Share this meeting</h3>
    <p>Anyone with this link can watch the recording and read the summary — no Recap account needed.</p>
    <div class="link-row"><input id="shareLink" readonly value="https://recap.app/share/8kd2-plq9-recap"><button class="btn" onclick="copyLink()">Copy</button></div>
    <div class="modal-actions"><button class="btn" onclick="closeShare()">Close</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// Minimal inline script placeholder — full script will be ported into React components.
document.getElementById('meetingList').innerHTML = '<div style="padding:16px;color:#9096ab">Design preview loaded. Use the app /design route to iterate.</div>';
</script>
</body>
</html>
